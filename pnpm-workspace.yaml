  postgres: ^3.4.5
  "@supabase/supabase-js": ^2.106.1
  "@supabase/ssr": ^0.6.1
  "@eslint/js": ^9.38.0
  "@tamagui/animations-css": ^1.144.4
  "@tamagui/animations-react-native": ^1.144.4
  "@tamagui/babel-plugin": ^1.144.4
  "@tamagui/core": ^1.144.4
  "@tamagui/next-plugin": ^1.144.4
  "@tamagui/web": ^1.144.4
  tamagui: ^1.144.4
  "@tailwindcss/postcss": ^4.3.0
  "@tailwindcss/vite": ^4.1.16
  "@tanstack/react-form": ^1.32.0
  "@tanstack/react-query": ^5.100.14
  "@trpc/client": ^11.8.0
  "@trpc/server": ^11.8.0
  "@trpc/tanstack-react-query": ^11.8.0
  "@types/node": ^22.18.12
  "@vitejs/plugin-react": 5.1.0
  "@vitest/coverage-v8": ^3.2.0
  eslint: ^9.38.0
  prettier: ^3.8.3
  tailwindcss: ^4.1.16
  typescript: ^5.9.3
  zod: ^4.1.12
  vite: 8.0.14
  vitest: ^3.2.0
  "@sentry/nextjs": ^10.53.1
  "@sentry/react-native": ^8.11.1

catalogs:
  react19:
    "@types/react": ~19.1.0
    "@types/react-dom": ~19.1.0
    react: 19.1.4
    react-dom: 19.1.4

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - tamagui

overrides:
  "@types/minimatch": 5.1.2
  lightningcss: 1.30.1
  vite: 8.0.14
  # security patches for transitive dependencies
  valibot: "^1.2.0"
  "esbuild@<0.25.0": "0.25.11"
  basic-ftp: "5.3.1"
  handlebars: "4.7.9"
  tar-fs: "2.1.4"
  glob: "10.5.0"
  node-forge: "1.4.0"
  devalue: "5.8.1"
  seroval: "1.5.4"
  tar: "7.5.15"
  rollup: "4.60.4"
  flatted: "3.4.2"
  undici: "7.24.0"
  kysely: "0.29.1"
  postcss: "8.5.14"
  lodash: "4.18.1"
  "@xmldom/xmldom": "0.8.13"
  js-yaml: "4.1.1"
  srvx: "0.11.15"
  yaml: "2.9.0"
  ip-address: "10.2.0"
  "@tanstack/start-server-core": "1.168.1"
  tmp: "0.2.5"
  ajv: "6.14.0"
  picomatch: "4.0.4"
  h3: "2.0.1-rc.22"
  # version-selector overrides for packages with conflicting major-version consumers
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "diff@>=4.0.0 <4.0.4": "4.0.4"
  "diff@>=6.0.0 <8.0.3": "8.0.3"
  "brace-expansion@<1.1.13": "1.1.13"

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
