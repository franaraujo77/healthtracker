name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/migrations-postapply/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push

      # Apply CONCURRENTLY-bearing companion files via `psql` in
      # autocommit mode (no `-1` flag; default is autocommit when
      # the file does NOT contain its own `BEGIN`/`COMMIT`).
      #
      # Supabase CLI's `db push` wraps every migration file in an
      # implicit per-file transaction, so `CREATE … CONCURRENTLY`
      # fails inside it with SQLSTATE 25001 (CLAUDE.md ops note
      # "Migration discipline"). Companion files live in a SIBLING
      # directory `supabase/migrations-postapply/` so the Supabase
      # CLI does not pick them up at `db push` time — only this psql
      # step applies them.
      #
      # Files are required to ship as bare DDL (no `BEGIN`/`COMMIT`),
      # carry `IF NOT EXISTS` / `CREATE … CONCURRENTLY IF NOT EXISTS`
      # guards, and remain safe to re-run on partial earlier success.
      #
      # Sequence: every companion file's parent table MUST be created
      # by a sibling migration that ran in the `db push` step above
      # (e.g. `0006_*` depends on `0005`'s `patient_invites`). `psql`
      # runs files in lexicographic order, mirroring the Supabase
      # CLI's ordering.
      - name: Apply CONCURRENTLY companion files via psql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations-postapply/*.sql)
          if (( ${#files[@]} == 0 )); then
            echo "No post-apply companion files to apply."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::group::psql autocommit -f $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
