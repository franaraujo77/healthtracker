name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Test
        run: pnpm test

  drizzle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Drizzle schema check
        run: pnpm db:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  rls-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      # Point the RLS tests at the local Supabase stack. dotenv-cli (used by
      # `with-env`) does not overwrite variables already in the environment,
      # so writes to $GITHUB_ENV take precedence over the .env placeholders.
      # We parse `supabase status -o env` line-by-line rather than `eval`ing
      # the output to avoid executing arbitrary shell if the CLI changes.
      - name: Export local Supabase env
        shell: bash
        run: |
          set -euo pipefail
          found_api_url=0
          found_db_url=0
          found_anon=0
          found_service=0
          while IFS= read -r line; do
            [[ "$line" =~ ^[A-Z_]+=.*$ ]] || continue
            key="${line%%=*}"
            val="${line#*=}"
            # strip surrounding double quotes if present
            val="${val#\"}"
            val="${val%\"}"
            case "$key" in
              API_URL)          echo "SUPABASE_URL=$val"             >> "$GITHUB_ENV"; found_api_url=1 ;;
              DB_URL)           echo "DATABASE_URL=$val"             >> "$GITHUB_ENV"; found_db_url=1 ;;
              ANON_KEY)         echo "SUPABASE_ANON_KEY=$val"        >> "$GITHUB_ENV"; found_anon=1 ;;
              SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$val" >> "$GITHUB_ENV"; found_service=1 ;;
            esac
          done < <(supabase status -o env)
          # Fail loudly if the Supabase CLI changes its env output schema —
          # otherwise the RLS tests would run against placeholder .env values
          # and report misleading failures deep in the logs.
          missing=()
          [[ $found_api_url -eq 1 ]] || missing+=("API_URL")
          [[ $found_db_url  -eq 1 ]] || missing+=("DB_URL")
          [[ $found_anon    -eq 1 ]] || missing+=("ANON_KEY")
          [[ $found_service -eq 1 ]] || missing+=("SERVICE_ROLE_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::supabase status -o env did not emit: ${missing[*]}" >&2
            exit 1
          fi

      - name: Run RLS adversarial tests
        run: pnpm test:rls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Build web app
        run: pnpm build -F @healthtracker/web
        env:
          SKIP_ENV_VALIDATION: "1"
          # Optional: enables Sentry source map upload when token is configured
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: pnpm test:a11y -F @healthtracker/web
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
