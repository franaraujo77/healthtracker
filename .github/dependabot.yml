# Dependabot config — this repo uses Renovate as the primary dependency
# tool (see .github/renovate.json). Dependabot is kept enabled only for
# GitHub-Actions ecosystem updates and for security advisories that
# Renovate doesn't surface (e.g. GHSA bumps with `security-updates` flow).
#
# Expo, React Native, Tamagui, React (core + types), and ESLint
# core+@eslint/js packages are explicitly ignored: their versions are
# governed by per-ecosystem coupling that CI cannot detect (Expo by
# `bundledNativeModules.json`, RN by Expo SDK, Tamagui by its
# compiler/runtime ABI across @tamagui/* siblings, React by Expo SDK
# 54's exact `react@19.1.0` pin plus the matched `react-dom`/
# `react-native` peer, ESLint by the eslint↔@eslint/js↔eslint-plugin-*
# peer-dep matrix that breaks at install time if any one is bumped
# alone). Bumping any one out of band breaks the others at install
# time, type-check, or runtime. The ecosystem upgrade is the atomic
# unit of work — see epics.md "Maintenance" section (M1 Expo SDK 56,
# M2 Tamagui 2.x, M3 ESLint v10).
#
# The `groups` block below ensures that when Dependabot opens a turbo
# bump it includes ALL turbo-family packages in one PR. Without this,
# bumping `turbo` alone leaves `@turbo/gen` and `eslint-plugin-turbo`
# behind, and Turborepo 2.9+'s `unsync-similar-dependencies` postinstall
# check fails every CI job (see PR #6 root cause).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      turborepo:
        patterns:
          - "turbo"
          - "@turbo/*"
          - "eslint-plugin-turbo"
          - "eslint-config-turbo"
    ignore:
      # Expo SDK is a coupled bundle (bundledNativeModules.json). Bump
      # via a single SDK-upgrade story, not per-package.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      # React Native + its native peers ship with the SDK; they cannot
      # safely drift from the SDK-pinned versions.
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      # Tamagui is a coupled compiler/runtime bundle: @tamagui/core,
      # @tamagui/web, @tamagui/animations-*, @tamagui/babel-plugin,
      # @tamagui/next-plugin, and the tamagui umbrella must all be on
      # the same major. Per-package dependabot bumps fragment the
      # ecosystem (see closed PR #34 for the @tamagui/core 2.0
      # fragmentation that motivated this).
      - dependency-name: "tamagui"
      - dependency-name: "@tamagui/*"
      # React is pinned by Expo SDK 54's bundledNativeModules.json to an
      # exact version. Bumping the `react19` catalog out of band crosses
      # the SDK contract — even patch/minor jumps inside 19.x can break
      # RN's bridgeless renderer expectations. The matched `react-dom`
      # and `@types/react` move together. Closed PR #37 demonstrated
      # this when dependabot tried 19.1.4 → 19.2.6.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # ESLint v10 has a peer-dep matrix that breaks at install if any
      # piece is bumped alone: `@eslint/js@10` requires `eslint@^10`,
      # most `eslint-plugin-*` peers (esp. @next/eslint-plugin-next)
      # have not broadly published v10 ranges yet, and the
      # `unstable_native_nodejs_ts_config` flag the workspace uses
      # would need a v10 audit. Closed PRs #39 (@eslint/js 9→10) and
      # #40 (eslint 9→10) both demonstrated the trap. Bump as one
      # coordinated story — see epics.md M3 ESLint v10 upgrade.
      # NOTE: typescript-eslint (and other downstream plugins whose
      # peer range explicitly accepts both v9 + v10) are intentionally
      # NOT ignored — they can land independently.
      - dependency-name: "eslint"
      - dependency-name: "@eslint/js"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
